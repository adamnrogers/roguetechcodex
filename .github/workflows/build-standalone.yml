name: Build Standalone Exe

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release label, e.g. v1.2.0"
        required: false
        default: "dev"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: |
          pip install pyinstaller
          pip install -r api/requirements.txt

      - name: Build frontend
        run: |
          cd frontend/src
          npm ci
          npm run build

      - name: Download RogueTech DB
        env:
          GH_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
        shell: pwsh
        run: |
          gh release download roguetech-db --repo adamrogers/roguetechcodex-data --pattern "roguetech.db" --output roguetech.db
          if (-not (Test-Path "roguetech.db")) {
            Write-Error "roguetech.db not found. Upload it first: gh release upload roguetech-db roguetech.db --clobber"
            exit 1
          }
          Write-Host "Database: $([math]::Round((Get-Item roguetech.db).Length / 1MB, 1)) MB"

      - name: Build exe
        run: pyinstaller standalone/roguetech.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RogueTech-Codex-Windows-${{ github.event.inputs.version }}
          path: dist\RogueTech-Codex\
          retention-days: 30
