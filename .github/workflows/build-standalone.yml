name: Build Standalone Exe

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release label, e.g. v1.2.0"
        required: false
        default: "dev"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: |
          pip install pyinstaller
          pip install -r api/requirements.txt

      - name: Build frontend
        run: |
          cd frontend/src
          npm ci
          npm run build

      # roguetech.db (102 MB) is not committed to git — it must be provided.
      # Option A: Upload it as a GitHub Actions artifact named "roguetech-db"
      #           in a separate job, then uncomment the download step below.
      # Option B: Build the exe locally using `make standalone-build` on Windows
      #           (or via `py -3.11` in WSL2 targeting the Windows Python install).
      #
      # Uncomment to download a pre-uploaded database artifact:
      # - uses: actions/download-artifact@v4
      #   with:
      #     name: roguetech-db
      #     path: .

      - name: Check database present
        shell: pwsh
        run: |
          if (-not (Test-Path "roguetech.db")) {
            Write-Error "roguetech.db not found at repo root. See workflow comments for how to supply it."
            exit 1
          }
          Write-Host "Database found: $((Get-Item roguetech.db).Length / 1MB) MB"

      - name: Build exe
        run: pyinstaller standalone/roguetech.spec

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RogueTech-Codex-Windows-${{ github.event.inputs.version }}
          path: dist\RogueTech-Codex\
          retention-days: 30
